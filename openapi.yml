openapi: 3.0.3
info:
  title: HMS Backend API
  version: 1.0.0
  description: |
    OpenAPI specification based solely on the application's actual Express routes and validation rules.
  contact:
    name: HMS Admin
    email: mrfortrancer@gmail.com
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://hms.fortrancer.in
    description: Production server
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and user session endpoints.
  - name: User
    description: User and patient profile operations.
  - name: Admin
    description: Admin user management operations.
  - name: Node
    description: Sidebar/navigation node operations.
  - name: UI
    description: Public UI support data.
  - name: Appointment
    description: Appointment scheduling and lookup.
  - name: MedicalRecord
    description: Medical record management.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request payload or missing required information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required or token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller does not have the required permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A resource conflict occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Something went wrong.
        statusCode:
          type: integer
          example: 500
        code:
          type: string
          example: INTERNAL_SERVER_ERROR
        details:
          type: object
          additionalProperties: true
    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully.
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: doctor@example.com
        password:
          type: string
          example: StrongPass123
        isClientApp:
          type: boolean
          example: false
    AuthLoginResponse:
      type: object
      properties:
        message:
          type: string
          example: login sucessfull
        email:
          type: string
          format: email
          example: doctor@example.com
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        role:
          type: string
          example: Doctor
        status:
          type: string
          example: Active
        firstLogin:
          type: boolean
          example: false
    SignUpRequest:
      type: object
      required:
        - name
        - role
        - email
        - department
        - designation
        - joiningDate
      properties:
        name:
          type: string
          example: Dr. Asha Menon
        role:
          type: string
          enum:
            - Admin
            - Super Admin
            - Doctor
            - Receptionist
            - Cashier
            - Nurse
            - Pharmacist
            - LabTech
          example: Doctor
        email:
          type: string
          format: email
          example: asha.menon@hms.com
        password:
          type: string
          example: StrongPass123
        status:
          type: string
          example: Pending
        department:
          type: string
          enum:
            - OPD
            - IPD
            - ICU
            - Pharmacy
            - Administration
            - Front Office
          example: OPD
        designation:
          type: string
          example: Senior Consultant
        joiningDate:
          type: string
          format: date
          example: 2025-01-15
        medicalRegistrationNo:
          type: string
          example: MED-1001
        specialization:
          type: string
          example: Cardiology
        qualification:
          type: string
          example: MBBS, MD
        consultationFee:
          type: number
          format: float
          example: 1000
        availabilitySlots:
          type: array
          items:
            type: string
          example: ["09:00", "11:00", "14:00"]
    SetPasswordRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: NewStrongPass123!
    VerifyEmailQuery:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        verification_token:
          type: string
          example: verification-token-123
    PatientSignUpRequest:
      type: object
      required:
        - name
        - role
        - email
        - gender
        - phone
        - dob
        - address
        - bloodGroup
      properties:
        name:
          type: string
          example: Rahul Sharma
        role:
          type: string
          example: Patient
        email:
          type: string
          format: email
          example: rahul.sharma@example.com
        password:
          type: string
          example: PatientPass123
        status:
          type: string
          example: Active
        phone:
          type: string
          example: +91-9876543210
        gender:
          type: string
          example: Male
        dob:
          type: string
          format: date
          example: 1992-05-14
        address:
          type: string
          example: 12, MG Road, Bengaluru
        bloodGroup:
          type: string
          enum:
            - A+
            - A-
            - B+
            - B-
            - AB+
            - AB-
            - O+
            - O-
          example: O+
        allergies:
          type: string
          example: Peanuts
        emergencyContact:
          type: string
          example: +91-9998887776
    ResetPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    VerifyResetPasswordQuery:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        reset_token:
          type: string
          example: reset-token-123
    AppointmentCreateRequest:
      type: object
      required:
        - patientId
        - doctorEmployeeId
        - date
        - timeSlot
        - createdByEmployeeId
      properties:
        patientId:
          type: string
          example: PAT-1001
        doctorEmployeeId:
          type: string
          example: EMP-2001
        date:
          type: string
          example: 2026-07-15
        timeSlot:
          type: string
          example: 10:30
        status:
          type: string
          example: Booked
        createdByEmployeeId:
          type: string
          example: EMP-1001
    AppointmentEditRequest:
      type: object
      required:
        - appointmentId
        - patientId
        - doctorEmployeeId
        - date
        - timeSlot
      properties:
        appointmentId:
          type: string
          example: APT-9001
        patientId:
          type: string
          example: PAT-1001
        doctorEmployeeId:
          type: string
          example: EMP-2001
        date:
          type: string
          example: 2026-07-16
        timeSlot:
          type: string
          example: 11:00
        status:
          type: string
          example: Rescheduled
    AppointmentStatusRequest:
      type: object
      required:
        - appointmentId
        - status
      properties:
        appointmentId:
          type: string
          example: APT-9001
        status:
          type: string
          example: Completed
    AppointmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        total:
          type: integer
          example: 23
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 5
    MedicalRecordCreateRequest:
      type: object
      required:
        - doctorId
        - appointmentId
        - patientId
        - diagnosis
        - complaint
        - symptoms
        - createdBy
      properties:
        doctorId:
          type: string
          example: EMP-2001
        appointmentId:
          type: string
          example: APT-9001
        patientId:
          type: string
          example: PAT-1001
        diagnosis:
          type: string
          example: Hypertension
        complaint:
          type: string
          example: Headache and dizziness
        symptoms:
          type: string
          example: Elevated blood pressure and fatigue
        medications:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Amlodipine
              dosage:
                type: string
                example: 5mg
              frequency:
                type: string
                example: Once daily
              duration:
                type: string
                example: 30 days
        medicalObservations:
          type: array
          items:
            type: object
            properties:
              metricName:
                type: string
                example: Blood Pressure
              metricValue:
                type: string
                example: 140/90
              recordedTime:
                type: string
                format: date-time
                example: 2026-07-08T10:30:00.000Z
        notes:
          type: string
          example: Patient advised dietary changes and routine monitoring
        status:
          type: string
          example: Completed
        createdBy:
          type: string
          example: EMP-1001
    MedicalRecordUpdateRequest:
      type: object
      required:
        - medicalRecordId
        - doctorId
        - appointmentId
        - patientId
        - diagnosis
        - complaint
        - symptoms
        - createdBy
      properties:
        medicalRecordId:
          type: string
          example: REC-1001
        doctorId:
          type: string
          example: EMP-2001
        appointmentId:
          type: string
          example: APT-9001
        patientId:
          type: string
          example: PAT-1001
        diagnosis:
          type: string
          example: Hypertension
        complaint:
          type: string
          example: Headache and dizziness
        symptoms:
          type: string
          example: Elevated blood pressure and fatigue
        medications:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Amlodipine
              dosage:
                type: string
                example: 5mg
              frequency:
                type: string
                example: Once daily
              duration:
                type: string
                example: 30 days
        medicalObservations:
          type: array
          items:
            type: object
            properties:
              metricName:
                type: string
                example: Blood Pressure
              metricValue:
                type: string
                example: 140/90
              recordedTime:
                type: string
                format: date-time
                example: 2026-07-08T10:30:00.000Z
        notes:
          type: string
          example: Updated patient history notes
        status:
          type: string
          example: Completed
        createdBy:
          type: string
          example: EMP-1001
        updatedBy:
          type: string
          example: EMP-1002
        updatedAt:
          type: string
          format: date-time
          example: 2026-07-09T12:00:00.000Z
    MedicalRecordQueryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        total:
          type: integer
          example: 12
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 3
    NodeCreateRequest:
      type: object
      required:
        - order
        - name
        - path
        - role
        - icon
      properties:
        order:
          type: integer
          example: 1
        name:
          type: string
          example: Dashboard
        path:
          type: string
          example: /dashboard
        role:
          type: array
          items:
            type: string
          example: ["Admin", "Doctor"]
        icon:
          type: string
          example: dashboard
    NodeEditRequest:
      type: object
      required:
        - nodeName
      properties:
        nodeName:
          type: string
          example: Dashboard
        data:
          type: object
          additionalProperties: true
    NodeDeleteRequest:
      type: object
      required:
        - nodeName
      properties:
        nodeName:
          type: string
          example: Dashboard
    PatientUpdateRequest:
      type: object
      required:
        - patientId
      properties:
        patientId:
          type: string
          example: PAT-1001
        name:
          type: string
          example: Rahul Sharma
        gender:
          type: string
          example: Male
        dob:
          type: string
          format: date
          example: 1992-05-14
        address:
          type: string
          example: 12, MG Road, Bengaluru
        bloodGroup:
          type: string
          example: O+
        allergies:
          type: string
          example: Penicillin
        emergencyContact:
          type: string
          example: +91-9998887776
    UpdateUserProfileRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
            status:
              type: string
            department:
              type: string
            role:
              type: string
            designation:
              type: string
            joiningDate:
              type: string
              format: date
            consultationFee:
              type: number
            availabilitySlots:
              type: array
              items:
                type: string
            medicalRegistrationNo:
              type: string
            specialization:
              type: string
    UpdateRoleRequest:
      type: object
      required:
        - roleName
      properties:
        roleName:
          type: string
          example: Doctor
        data:
          type: object
          additionalProperties: true
    UserProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Sucessfully obtained user information
        name:
          type: string
          example: Dr. Asha Menon
        email:
          type: string
          format: email
          example: asha.menon@hms.com
        status:
          type: string
          example: Active
        role:
          type: string
          example: Doctor
        employeeId:
          type: string
          example: EMP-2001
        isVerified:
          type: boolean
          example: true
        firstLogin:
          type: boolean
          example: false
        department:
          type: string
          example: OPD
        designation:
          type: string
          example: Senior Consultant
        joiningDate:
          type: string
          format: date
          example: 2025-01-15
        medicalRegistrationNo:
          type: string
          example: MED-1001
        specialization:
          type: string
          example: Cardiology
        qualification:
          type: string
          example: MBBS, MD
        consultationFee:
          type: number
          example: 1000
        availabilitySlots:
          type: array
          items:
            type: string
          example: ["09:00", "11:00"]
    PatientProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Sucessfully obtained user information
        email:
          type: string
          format: email
          example: rahul.sharma@example.com
        status:
          type: string
          example: Active
        role:
          type: string
          example: Patient
        isVerified:
          type: boolean
          example: true
        uhid:
          type: string
          example: PAT-1001
        name:
          type: string
          example: Rahul Sharma
        gender:
          type: string
          example: Male
        dob:
          type: string
          format: date
          example: 1992-05-14
        allergies:
          type: string
          example: Peanuts
        bloodGroup:
          type: string
          example: O+
        address:
          type: string
          example: 12, MG Road, Bengaluru
        phone:
          type: string
          example: +91-9876543210
        emergencyContact:
          type: string
          example: +91-9998887776
    PermissionsResponse:
      type: object
      additionalProperties: true
paths:
  /auth/signUp:
    post:
      tags: [Auth]
      summary: Register employee sign-up
      description: Creates a new employee profile and sends verification email.
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      description: Authenticates a user and returns access token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/set-password:
    post:
      tags: [Auth]
      summary: Set password for first-time user
      description: Sets a password for a newly created user.
      operationId: setPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: Password updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify user email
      description: Validates email verification token.
      operationId: verifyEmail
      security: []
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
        - in: query
          name: verification_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/patientSignUp:
    post:
      tags: [Auth]
      summary: Register patient
      description: Creates a patient profile and linked user account.
      operationId: patientSignUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSignUpRequest'
      responses:
        '201':
          description: Patient account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/getPermissions:
    get:
      tags: [Auth]
      summary: Get role permissions
      description: Retrieves permissions for the supplied role.
      operationId: getPermissions
      security: []
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Permissions returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/refresh-token:
    get:
      tags: [Auth]
      summary: Refresh access token
      description: Issues a fresh access token using the refresh token cookie.
      operationId: refreshToken
      security: []
      responses:
        '200':
          description: Access token refreshed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Request password reset
      description: Sends password reset email if the account exists.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Reset link sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/verify-reset-password:
    get:
      tags: [Auth]
      summary: Verify reset password token
      description: Validates reset token and enables password reset.
      operationId: verifyResetPassword
      security: []
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
        - in: query
          name: reset_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reset token verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/logout:
    get:
      tags: [Auth]
      summary: Logout current user
      description: Clears refresh token cookie and ends session.
      operationId: logout
      responses:
        '200':
          description: Logout completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user/getUserProfile:
    get:
      tags: [User]
      summary: Get user profile by email
      description: Returns employee profile data for the supplied email.
      operationId: getUserProfile
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/getPatients:
    get:
      tags: [User]
      summary: Get patients list
      description: Returns a paginated list of patients.
      operationId: getPatients
      parameters:
        - in: query
          name: page
          required: true
          schema:
            type: integer
            example: 1
        - in: query
          name: limit
          required: true
          schema:
            type: integer
            example: 10
        - in: query
          name: selectedText
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Patients retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/deletePatient:
    post:
      tags: [User]
      summary: Delete patient
      description: Soft-deletes a patient and related user records.
      operationId: deletePatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientId
              properties:
                patientId:
                  type: string
                  example: PAT-1001
                deletedBy:
                  type: string
                  example: EMP-1001
      responses:
        '200':
          description: Patient deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/getPatientProfile:
    get:
      tags: [User]
      summary: Get patient profile by email
      description: Returns patient profile data for the supplied email.
      operationId: getPatientProfile
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Patient profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/getPatientId:
    get:
      tags: [User]
      summary: Get patient ID by email
      description: Returns the patient UHID associated with the email.
      operationId: getPatientId
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Patient ID returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
