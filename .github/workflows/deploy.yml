name: Deploy HMS Backend

on:
  push:
    branches:
      - feature/sprint_5/merin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_MERIN_HOST }}
          username: ${{ secrets.EC2_MERIN_USER }}
          key: ${{ secrets.EC2_MERIN_SSH_KEY }}
          script: |
            cd hms-backend-pod-3
            git pull origin feature/sprint_5/merin
            npm ci
            pm2 restart hms-backend || pm2 start src/server.js --name hms-backend
            pm2 save