name: Deploy Backend

on:
  push:
    branches:
      - feature/sprint_5/aswin

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ubuntu/HMS_PROJECT/hms-backend-pod-3

            git fetch origin
            git checkout feature/sprint_5/aswin
            git pull origin feature/sprint_5/aswin

            npm ci

            sudo pm2 restart healthcare-api
            sudo pm2 save

            echo "Backend deployment completed successfully"
